name: Daily Merge Clash Nodes

on:
  schedule:
    # 每 4 小时运行一次（UTC 时间：0,4,8,12,16,20 → 北京时间 8,12,16,20,0,4）
    - cron: '0 */4 * * *'
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write       # 允许推送代码到仓库

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Run merge script
        run: python scripts/merge_clash.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash/merged.yaml
          git diff --staged --quiet || git commit -m "chore: auto-update merged clash config [skip ci]"
          git push
